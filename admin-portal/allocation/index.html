<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Allocation | Student Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
<link rel="icon" href="../../assets/favicon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="SsDash">
        <div class="container"><h1 class="display-4 text-white">Student Services</h1><p class="lead text-white">Student Management Portal</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown active">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-house-door"></i>&nbsp;Manage Dormitory</a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="../dormitory/index.html">All Dormitories</a></div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="#">My Account</a></div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-sm-12">
                <h3>Assign Student Room</h3>
                <small class="text-muted" id="breadcrumb">Manage Dormitory / Room Allocation</small>
                <hr>
            </div>
            <div class="col-md-12">		
                <div class="row" id="dorm-selection">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            const role = localStorage.getItem('npipng_role');
            if (role !== 'SS') { window.location.href = '../authentication/index.html'; return; }
            $('.user-name-placeholder').text(localStorage.getItem('npipng_name'));

            const studentId = new URLSearchParams(window.location.search).get('id');
            if(!studentId) { window.location.href = '../records/index.html'; return; }

            loadNPIPNGData(function(data) {
                const student = DB.getStudent(studentId);
                if(!student) { alert("Student not found"); return; }

                $('#breadcrumb').text(`Manage Dormitory / Room Allocation / ${student.firstname} ${student.lastname}`);

                // Filter dorms by student gender
                const availableDorms = data.dorms ? data.dorms.filter(d => d.dormType === student.gender) : [];
                const container = $('#dorm-selection');

                if (availableDorms.length === 0) {
                    container.html(`<div class="alert alert-warning w-100">No dormitories available for ${student.gender} students.</div>`);
                    return;
                }

                availableDorms.forEach(dorm => {
                    const rooms = data.rooms ? data.rooms.filter(r => r.dormID == dorm.dormID) : [];
                    let roomsHtml = '';

                    rooms.forEach(room => {
                        // Count occupants
                        const occupants = data.room_assign ? data.room_assign.filter(ra => ra.roomID == room.roomID) : [];
                        // Only show rooms with space
                        if (occupants.length < room.numOfOccup) {
                            roomsHtml += `
                                <div class="col-md-3 col-sm-4 col-xs-6" style="margin-bottom: 20px;">
                                    <button class="btn btn-sm btn-block btn-outline-primary" onclick="alert('Assigned to ${room.placeNumber}!')">
                                        ${room.placeNumber}
                                    </button>
                                </div>
                            `;
                        }
                    });

                    container.append(`
                        <div class="col-sm-6 col-xs-12">
                            <div class="card">
                                <div class="card-header text-center">
                                    <h3 class="display-4">${dorm.dormCode}</h3>
                                    <small class="text-muted">Select a room...</small>
                                </div>
                                <div class="card-body">
                                    <div class="form-row">
                                        ${roomsHtml || '<div class="col-12 text-muted">No available rooms.</div>'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            });
        });
    </script>
</body>
</html>
