<div id="dynamic-banner"></div>
<script>
    $(document).ready(function() {
        const path = window.location.pathname;
        let bannerTitle = "";
        let bannerSub = "";
        let bannerID = "";

        // Detect which portal we are in based on URL path
        if (path.includes('acad-portal')) {
            bannerTitle = "Academic Portal";
            bannerSub = "Learning & Course Management";
            bannerID = "Home";
        } else if (path.includes('admin-portal')) {
            bannerTitle = "Administration Portal";
            bannerSub = "Student Management Portal";
            bannerID = "AdminLogin";
        } else if (path.includes('superuser-portal')) {
            bannerTitle = "Systems Administration";
            bannerSub = "Super Administrator Portal";
            bannerID = "SuperUserDash";
        }

        // Inject the HTML
        if (bannerID !== "") {
            $('#dynamic-banner').html(`
                <div class="jumbotron jumbotron-fluid" id="${bannerID}">
                    <div class="container">
                        <h1 class="display-4 text-white">${bannerTitle}</h1>
                        <p class="lead text-white">${bannerSub}</p>
                    </div>
                </div>
            `);
        }
    });
</script>
