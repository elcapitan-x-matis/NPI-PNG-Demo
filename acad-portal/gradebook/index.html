<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gradebook | Academic Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="StudentDash">
        <div class="container"><h1 class="display-4 text-white">My Dashboard</h1><p class="lead text-white">Academic Portal</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-book"></i>&nbsp;My Course</a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="../course/index.html">All Courses</a></div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item active" href="index.html">My Gradebook</a></div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-sm-12">
                <span class="float-right">
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="window.print()">
                        <i class="bi-printer"></i>&nbsp;Print Gradebook
                    </button>
                </span>
                <h2><i class="bi-book"></i>&nbsp;My Gradebook</h2>
                <small class="text-muted"><span class="user-name-placeholder"></span></small>
                <hr>
            </div>
            <div class="col-md-12" id="gradebook-container">
                <!-- Injected via JS -->
            </div>
        </div>	
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            const role = localStorage.getItem('npipng_role');
            const userId = localStorage.getItem('npipng_id');
            $('.user-name-placeholder').text(localStorage.getItem('npipng_name'));

            if (role !== 'STUDENT') { window.location.href = '../authentication/index.html'; return; }

            loadNPIPNGData(function(data) {
                const enrollments = DB.getEnrollments(userId);
                const container = $('#gradebook-container');

                if (enrollments.length === 0) {
                    container.html('<div class="alert alert-warning">You have not enrolled in any units!</div>');
                    return;
                }

                enrollments.forEach(enrol => {
                    const unitId = parseInt(enrol.offerID.split('.')[0]);
                    const unit = DB.getUnit(unitId);
                    if (!unit) return;

                    const activities = data.activities.filter(a => a.unitID === unitId);
                    
                    let tableHtml = `<div class="table-responsive mb-4"><table class="table table-sm table-hover">
                        <thead>
                            <tr class="thead-light"><th colspan="3">${unit.unitName} (${unit.unitCode})</th></tr>
                            <tr><th>Assessment Item</th><th>Score</th><th>Weight (%)</th></tr>
                        </thead><tbody>`;

                    let totalStdMarks = 0, totalStdWeight = 0, totalOverallMarks = 0, totalOverallWeight = 0;

                    if(activities.length === 0) {
                        tableHtml += `<tr><td colspan="3" class="text-muted">No assessments have been added for this unit yet.</td></tr>`;
                    } else {
                        activities.forEach(act => {
                            totalOverallMarks += act.totalMarks;
                            totalOverallWeight += act.percentage;
                            const mark = data.activity_marks.find(m => m.studentID == userId && m.activityID == act.ID);
                            
                            let scoreCell = `<td>-- / ${act.totalMarks}</td>`;
                            let weightCell = `<td>-- / ${act.percentage} %</td>`;

                            if (mark) {
                                totalStdMarks += mark.score;
                                totalStdWeight += mark.weight;
                                scoreCell = `<td><span class="text-success">${mark.score}</span> / ${act.totalMarks}</td>`;
                                weightCell = `<td><span class="text-success">${mark.weight}</span> / ${act.percentage} %</td>`;
                            }
                            tableHtml += `<tr><td>${act.title}</td>${scoreCell}${weightCell}</tr>`;
                        });
                    }

                    const finalGrade = Calc.getGrade(totalStdWeight);
                    const gradeBadge = totalStdWeight > 0 ? `<span class="badge badge-primary">${finalGrade}</span>` : `<span class="badge badge-light">NIL</span>`;

                    tableHtml += `</tbody><tfoot>
                        <tr><th>Totals</th><td>${totalStdMarks} / ${totalOverallMarks}</td><td>${totalStdWeight} / ${totalOverallWeight} %</td></tr>
                        <tr class="text-right"><th colspan="2">Final Grade</th><td>${gradeBadge}</td></tr>
                    </tfoot></table></div>`;

                    container.append(tableHtml);
                });
            });
        });
    </script>
</body>
</html>
