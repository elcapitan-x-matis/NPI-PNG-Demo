<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment History | Academic Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
<link rel="icon" href="../../assets/favicon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="StudentDash">
        <div class="container"><h1 class="display-4 text-white">My Dashboard</h1><p class="lead text-white">Academic Portal</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-book"></i>&nbsp;My Course</a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="../course/index.html">All Courses</a></div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="../gradebook/index.html">My Gradebook</a>
                        <a class="dropdown-item active" href="index.html">Enrollment History</a>
                    </div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <h2><i class="bi-archive"></i>&nbsp;Enrollment History</h2>
                <small class="text-muted"><span class="user-name-placeholder"></span> / Enrollments</small>
                <hr>
            </div>
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-hover table-sm" id="enrol-table">
                        <thead>
                            <tr>
                                <th>Unit Code</th>
                                <th>Name</th>
                                <th class="text-center">Enrolment Status</th>
                            </tr>
                        </thead>
                        <tbody id="enrol-list">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>	
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            const role = localStorage.getItem('npipng_role');
            const userId = localStorage.getItem('npipng_id');
            $('.user-name-placeholder').text(localStorage.getItem('npipng_name'));

            if (role !== 'STUDENT') { window.location.href = '../authentication/index.html'; return; }

            loadNPIPNGData(function(data) {
                // Fetch all enrollments for this student (including historical ones)
                const enrollments = data.enrollments.filter(e => e.studentID == userId);
                const container = $('#enrol-list');

                if (enrollments.length === 0) {
                    container.html('<tr><td colspan="3" class="text-center">No enrollment history found.</td></tr>');
                    return;
                }

                enrollments.forEach(enrol => {
                    const unitId = parseInt(enrol.offerID.split('.')[0]);
                    const unit = DB.getUnit(unitId);
                    if (!unit) return;

                    const isEnrolled = enrol.enrollStatus == 1;
                    const badgeStyle = isEnrolled ? 'success' : 'warning';
                    const badgeText = isEnrolled ? 'Enrolled <i class="bi-check"></i>' : 'Unenrolled <i class="bi-x"></i>';

                    container.append(`
                        <tr>
                            <td>${unit.unitCode}</td>
                            <td>
                                <a href="../unit/index.html?id=${unit.unitID}">
                                    ${unit.unitName} <i class="bi-chevron-right"></i>
                                </a>
                            </td>
                            <td class="align-middle text-center">
                                <span class="badge badge-pill badge-${badgeStyle}">${badgeText}</span>
                            </td>
                        </tr>
                    `);
                });
            });
        });
    </script>
</body>
</html>
