<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Enrollments | Academic Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
<link rel="icon" href="../../assets/favicon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="InstructorDash">
        <div class="container"><h1 class="display-4 text-white">Course Administration</h1><p class="lead text-white">Academic Portal</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-book"></i>&nbsp;My Units</a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="#">Current Unit</a></div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="#">My Account</a></div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <span class="float-right">
                    <button class="btn btn-sm btn-outline-dark" onclick="alert('Create enrollment modal not available in demo')">
                        Create an Enrollment&nbsp;<i class="bi-chevron-right"></i>
                    </button>
                </span>
                <h2><i class="bi-book"></i>&nbsp;Enrolled Student Gradebook</h2>
                <small class="text-muted"><span id="unit-name">Unit</span> / Enrollments</small>
                <hr>
            </div>
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead>
                            <tr class="text-center">
                                <th>ID</th>
                                <th>Student</th>
                                <th>Email</th>
                                <th>Course Completion</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="enrol-list">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>	
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            const role = localStorage.getItem('npipng_role');
            const userId = localStorage.getItem('npipng_id');
            const userName = localStorage.getItem('npipng_name');
            $('.user-name-placeholder').text(userName);

            if (role !== 'INSTRUCTOR') { window.location.href = '../authentication/index.html'; return; }

            // In a real app, this would come from the URL. We default to unit 180.
            const unitId = new URLSearchParams(window.location.search).get('id') || 180;

            loadNPIPNGData(function(data) {
                const unit = DB.getUnit(unitId);
                if(unit) $('#unit-name').text(unit.unitName);

                // Find offerings for this unit
                const offerings = data.offerings.filter(o => o.unitID == unitId);
                const offerIds = offerings.map(o => o.offerID);

                // Find all enrollments for these offerings
                const enrollments = data.enrollments.filter(e => offerIds.includes(e.offerID) && e.enrollStatus == 1);
                const container = $('#enrol-list');

                if (enrollments.length === 0) {
                    container.html('<tr><td colspan="5" class="text-center">No students enrolled in this unit yet.</td></tr>');
                    return;
                }

                enrollments.forEach(enrol => {
                    const student = DB.getStudent(enrol.studentID);
                    if(!student) return;

                    // Fetch activities and marks for this student in this unit
                    const activities = data.activities.filter(a => a.unitID == unitId);
                    let activityHtml = '';
                    
                    activities.forEach(act => {
                        const mark = data.activity_marks.find(m => m.studentID == student.studentID && m.activityID == act.ID);
                        const scoreText = mark ? `<span class="text-success">${mark.score} / ${act.totalMarks}</span>` : `-- / ${act.totalMarks}`;
                        const weightText = mark ? `<span class="text-success">${mark.weight}%</span>` : `-- %`;
                        
                        activityHtml += `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>${act.title}</div>
                                <div>${scoreText} (${weightText})</div>
                            </li>
                        `;
                    });

                    container.append(`
                        <tr>
                            <td class="text-center align-middle">${student.studentID}</td>
                            <td class="text-center align-middle">${student.firstname} ${student.lastname}</td>
                            <td class="text-center align-middle">${student.email}</td>
                            <td>
                                <p class="lead mb-1">${enrol.score || 0}% Complete</p>
                                <small class="text-muted">Click the progress bar for details</small>
                                <a href="#" data-toggle="modal" data-target="#modal${student.studentID}">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped bg-success" role="progressbar" style="width: ${enrol.score || 0}%"></div>
                                    </div>
                                </a>

                                <!-- Modal -->
                                <div class="modal fade" id="modal${student.studentID}" tabindex="-1">
                                    <div class="modal-dialog modal-lg modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title"><i class="bi-book-half"></i> Grade Assessment</h5>
                                                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                                            </div>
                                            <div class="modal-body">
                                                <h5>${student.firstname} ${student.lastname}</h5>
                                                <div class="row mt-3">
                                                    <div class="col-md-4">
                                                        <p class="lead">
                                                            Final Score: ${enrol.score || 'N/A'}<br>
                                                            Final Grade: ${enrol.grade || 'N/A'}
                                                        </p>
                                                    </div>
                                                    <div class="col-md-8">
                                                        <ul class="list-group list-group-flush">
                                                            ${activityHtml || '<li class="list-group-item text-muted">No activities found.</li>'}
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </td>
                            <td class="align-middle text-center">
                                <button class="btn btn-sm btn-outline-primary" onclick="alert('Unenroll action')">
                                    <i class="bi-x-circle"></i>&nbsp;Unenroll
                                </button>
                            </td>
                        </tr>
                    `);
                });
            });
        });
    </script>
</body>
</html>
