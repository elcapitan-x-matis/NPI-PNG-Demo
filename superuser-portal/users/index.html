<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Accounts | Superuser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="SuperUserDash">
        <div class="container"><h1 class="display-4 text-white">Systems Administration</h1><p class="lead text-white">Superuser Dashboard</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown active">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-people"></i>&nbsp;Manage Accounts</a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="?staff">Staff Accounts</a>
                        <a class="dropdown-item" href="?student">Student Accounts</a>
                        <a class="dropdown-item" href="?superuser">Superusers</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item" href="../settings/index.html">My Account</a></div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-sm-12">
                <h2><i class="bi-people"></i>&nbsp;<span id="page-title">Accounts</span></h2>
                <small class="text-muted">Systems Administration / Manage Accounts</small>
                <hr>
            </div>
            <div class="col-md-12">
                <div id="table-container"></div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            if (localStorage.getItem('npipng_role') !== 'SUPERUSER') {
                window.location.href = '../authentication/index.html';
                return;
            }
            $('.user-name-placeholder').text(localStorage.getItem('npipng_name'));

            loadNPIPNGData(function(data) {
                const urlParams = new URLSearchParams(window.location.search);
                
                if (urlParams.has('staff')) {
                    $('#page-title').text("Staff Account Registry");
                    renderStaffTable(data.staff);
                } else if (urlParams.has('student')) {
                    $('#page-title').text("Student Account Registry");
                    renderStudentTable(data.students);
                } else if (urlParams.has('superuser')) {
                    $('#page-title').text("Super Administrator Registry");
                    renderSuperuserTable(data.admins);
                } else {
                    // Default view
                    $('#page-title').text("Manage Accounts");
                    $('#table-container').html('<div class="alert alert-info">Please select an account type from the menu.</div>');
                }
            });

            function renderStaffTable(staffList) {
                let html = `<table class="table table-sm table-hover"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th class="text-center">Action</th></tr></thead><tbody>`;
                
                staffList.forEach(staff => {
                    const badge = staff.activationStat == 1 ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>';
                    const btn = staff.activationStat == 1 
                        ? `<button class="btn btn-sm btn-outline-secondary" onclick="alert('Deactivate clicked')">De-Activate</button>` 
                        : `<button class="btn btn-sm btn-primary" onclick="alert('Activate clicked')">Activate</button>`;
                    
                    html += `<tr>
                        <td>${staff.staffID}</td>
                        <td><a href="../account/index.html?id=${staff.staffID}">${staff.firstname} ${staff.lastname}</a></td>
                        <td>${staff.email}</td>
                        <td><span class="badge badge-info">${staff.roleCode}</span></td>
                        <td class="text-center">${badge} ${btn}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                $('#table-container').html(html);
            }

            function renderStudentTable(studentList) {
                let html = `<table class="table table-sm table-hover"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th class="text-center">Action</th></tr></thead><tbody>`;
                
                studentList.forEach(student => {
                    const course = DB.getCourse(student.courseTaken);
                    const badge = student.activationStat == 1 ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>';
                    const btn = student.activationStat == 1 
                        ? `<button class="btn btn-sm btn-outline-secondary" onclick="alert('Deactivate clicked')">De-Activate</button>` 
                        : `<button class="btn btn-sm btn-primary" onclick="alert('Activate clicked')">Activate</button>`;
                    
                    html += `<tr>
                        <td>${student.studentID}</td>
                        <td><a href="../account/index.html?id=${student.studentID}">${student.firstname} ${student.lastname}</a></td>
                        <td>${student.email}</td>
                        <td>${course ? course.courseCode : 'N/A'}</td>
                        <td class="text-center">${badge} ${btn}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                $('#table-container').html(html);
            }

            function renderSuperuserTable(adminList) {
                let html = `<table class="table table-sm table-hover"><thead><tr><th>ID</th><th>Admin</th><th class="text-center">Create</th><th class="text-center">Update</th><th class="text-center">Delete</th><th class="text-center">Activate</th></tr></thead><tbody>`;
                
                adminList.forEach(admin => {
                    const toggle = (flag) => flag == 1 
                        ? `<button class="btn btn-sm btn-outline-secondary" onclick="alert('Prohibit clicked')"><i class="bi-x-circle"></i></button>` 
                        : `<button class="btn btn-sm btn-primary" onclick="alert('Allow clicked')"><i class="bi-check-circle"></i></button>`;

                    html += `<tr>
                        <td>${admin.adminID}</td>
                        <td><a href="../account/index.html?id=${admin.adminID}">${admin.firstname} ${admin.lastname}</a><br><small class="text-muted">${admin.email}</small></td>
                        <td class="text-center">${toggle(admin.access_create)}</td>
                        <td class="text-center">${toggle(admin.access_update)}</td>
                        <td class="text-center">${toggle(admin.access_delete)}</td>
                        <td class="text-center">${toggle(admin.access_activation)}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                $('#table-container').html(html);
            }
        });
    </script>
</body>
</html>
