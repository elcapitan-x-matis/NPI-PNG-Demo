<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Settings | Superuser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>

    <div class="jumbotron jumbotron-fluid" id="SuperUserDash">
        <div class="container"><h1 class="display-4 text-white">Systems Administration</h1><p class="lead text-white">Superuser Dashboard</p></div>
    </div>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
        <a class="navbar-brand" href="../dashboard/index.html"><img src="../../assets/favicon/android-chrome-192x192.png" width="35" height="35" class="img-fluid"></a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="../dashboard/index.html"><i class="bi-speedometer2"></i>&nbsp;Dashboard</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"><i class="bi-people"></i>&nbsp;Manage Accounts</a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="../users/index.html?staff">Staff Accounts</a>
                        <a class="dropdown-item" href="../users/index.html?student">Student Accounts</a>
                        <a class="dropdown-item" href="../users/index.html?superuser">Superusers</a>
                    </div>
                </li>
                <li class="nav-item dropdown active">
                    <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">Hi, <span class="user-name-placeholder">User</span></a>
                    <div class="dropdown-menu"><a class="dropdown-item active" href="index.html">My Account</a></div>
                </li>
            </ul>
            <form class="form-inline" id="LogoutForm"><button class="btn btn-outline-primary btn-sm" type="submit">Sign Out</button></form>
        </div>
    </nav>

    <div class="container body">
        <div class="row justify-content-center">
            <div class="col-sm-12">
                <h2><span id="admin-name">Loading...</span></h2>
                <small class="text-muted">Super Administrator Account</small>
                <hr>
            </div>
            
            <div class="col-md-9 col-sm-8 col-xs-12">
                <dl class="row" id="info-list"></dl>
            </div>

            <div class="col-md-3 col-sm-4 col-xs-12">
                <div class="card">
                    <div class="card-header"><h5><i class="bi-gear"></i>&nbsp;Settings</h5></div>
                    <div class="card-body">
                        <button class="btn btn-sm btn-block btn-primary" onclick="alert('Change password not available in demo')">
                            <i class="bi-key"></i>&nbsp;Change Password
                        </button>
                    </div>
                </div>
            </div>
        </div>	
    </div>

    <footer class="footer mt-5"><p class="text-white">Copyright &copy; <span id="year"></span>, NPIPNG</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data-loader.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            if (localStorage.getItem('npipng_role') !== 'SUPERUSER') {
                window.location.href = '../authentication/index.html';
                return;
            }
            const adminId = localStorage.getItem('npipng_id');
            $('.user-name-placeholder').text(localStorage.getItem('npipng_name'));

            loadNPIPNGData(function(data) {
                const admin = data.admins.find(a => a.adminID === adminId);
                if(!admin) {
                    $('#admin-name').text("Admin not found");
                    return;
                }
                
                $('#admin-name').text(`${admin.firstname} ${admin.lastname}`);
                $('#info-list').html(`
                    <dt class="col-sm-4">Username</dt><dd class="col-sm-8">${admin.username}</dd>
                    <dt class="col-sm-4">Email</dt><dd class="col-sm-8">${admin.email}</dd>
                    <dt class="col-sm-4">Account ID</dt><dd class="col-sm-8">${admin.adminID}</dd>
                    <dt class="col-sm-4">Access Permissions</dt>
                    <dd class="col-sm-8">
                        <span class="badge badge-success">Full System Access</span>
                    </dd>
                `);
            });
        });
    </script>
</body>
</html>
